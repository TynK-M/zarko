name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Format, build, test and examples
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Check formatting
        run: zig fmt --check .

      - name: Build
        run: zig build

      - name: Run tests
        run: zig build test
      
      - name: Run parser example
        run: zig build run-parser

      - name: Run file parser example
        run: zig build run-file-parser
